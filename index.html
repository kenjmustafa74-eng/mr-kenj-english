<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Your English Study Guide with Mr. Kenj</title>
<link rel="manifest" href="manifest.json">

<style>
/* Layout: sticky app bar + tab strip, one content column (max 1080px); games take over the column like a full index card. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --sunk:#e9edf6; --ink:#18203d; --muted:#5b6585; --line:#d6dcea;
  --a:#f2b31b; --a-ink:#5a3f00; --b:#0f9e93; --b-ink:#003f3a; --c:#7a4cf0; --c-ink:#2a0f7a;
  --accent:#2d5bff; --accent-ink:#ffffff; --good:#1c9c5b; --bad:#e2513d; --card:#fffdf4; --rule:#c9d8f2; --margin:#f19a9a;
  --display:"Gabarito","Trebuchet MS",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(24,32,61,.06),0 6px 20px rgba(24,32,61,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1326; --surface:#181e38; --sunk:#222a4a; --ink:#eef1fb; --muted:#a3acc9; --line:#2f385c;
  --a-ink:#ffe39a; --b-ink:#a5f2ea; --c-ink:#d9ccff; --accent:#7d9bff; --accent-ink:#0b1030; --good:#45c983; --bad:#ff7a66;
  --card:#1f2747; --rule:#2e3a63; --margin:#7a3b4a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1326; --surface:#181e38; --sunk:#222a4a; --ink:#eef1fb; --muted:#a3acc9; --line:#2f385c;
  --a-ink:#ffe39a; --b-ink:#a5f2ea; --c-ink:#d9ccff; --accent:#7d9bff; --accent-ink:#0b1030; --good:#45c983; --bad:#ff7a66;
  --card:#1f2747; --rule:#2e3a63; --margin:#7a3b4a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{width:62px;height:47px;flex:none;display:block}
.logo .lb-body{fill:var(--ink)}
.logo .lb-dot{fill:var(--a)}
.logo text{fill:var(--bg);font-family:var(--display);font-weight:800}
.brand{min-width:0;flex:1}
.brand h1{font-size:clamp(17px,2.4vw,22px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:15px;height:15px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
main{padding-block:24px 64px;display:grid;gap:24px}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--sunk);font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{border-color:var(--ink)}
/* hero */
.hello{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.hello{grid-template-columns:1fr}}
.hello h2{font-size:clamp(26px,4vw,36px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* index card */
.icard{background:var(--card);border-radius:var(--r);border:1px solid var(--line);position:relative;padding:18px 18px 18px 34px;
  background-image:linear-gradient(var(--card) 46px,transparent 46px),repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);box-shadow:var(--shadow)}
.icard::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--margin)}
.wotd-word{font-family:var(--display);font-size:34px;font-weight:800}
.lvl-switch{display:flex;gap:8px;flex-wrap:wrap}
.lvl-switch button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;text-align:left}
.lvl-switch button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lvl-switch button[aria-pressed="true"]{border-color:var(--lv);box-shadow:inset 0 0 0 1px var(--lv)}
.lv-A{--lv:var(--a);--lv-ink:var(--a-ink)} .lv-B{--lv:var(--b);--lv-ink:var(--b-ink)} .lv-C{--lv:var(--c);--lv-ink:var(--c-ink)}
.lesson{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-width:0;position:relative;overflow:hidden}
.lesson::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lv)}
.lesson:hover{border-color:var(--lv)}
.lesson .num{font-family:var(--display);font-weight:800;color:var(--lv-ink);font-size:13px;letter-spacing:.06em}
.lesson h3{font-size:18px}
.cap::first-letter,.lesson h3::first-letter{text-transform:uppercase}
.lesson p{margin:0;font-size:13px;color:var(--muted)}
.meter{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lv,var(--accent));border-radius:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sunk)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--a) 25%,transparent);color:var(--a-ink)}
.lvl-switch button.is-locked{border-color:var(--bad)}
.lvl-switch button.is-locked small{color:var(--bad)}
.lock-panel{display:grid;gap:8px}
.switch-row{display:flex;gap:8px;flex-wrap:wrap}
.switch-row button{display:inline-flex;flex-direction:column;align-items:flex-start}
.switch-row button small{font-weight:400;color:var(--muted)}
.switch-row button[aria-pressed="true"]{border-color:var(--bad)}
.switch-row button[aria-pressed="true"] small{color:var(--bad)}
/* word list */
.words{display:grid;gap:8px}
.word{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.word b{font-family:var(--display);font-size:19px}
.word .ex{font-style:italic;color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:6px}
.act:hover{border-color:var(--accent)}
.act svg{width:26px;height:26px;color:var(--accent)}
.act b{font-family:var(--display);font-size:17px}
.act span{font-size:13px;color:var(--muted)}
/* games */
.game{max-width:720px;margin:0 auto;width:100%;display:grid;gap:16px}
.game-top{display:flex;align-items:center;gap:12px}
.game-top .meter{flex:1}
.flash{perspective:1200px;cursor:pointer;min-height:260px}
.flash-inner{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.flash .back{transform:rotateY(180deg)}
.big-word{font-family:var(--display);font-size:clamp(32px,6vw,48px);font-weight:800;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt[disabled]{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:15px;min-height:52px;text-align:center}
.tile.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.tile.done{visibility:hidden}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.spell-in{font-size:24px;text-align:center;font-family:var(--display)}
.feedback{min-height:28px;font-weight:700}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.stars{display:flex;gap:6px}
.stars svg{width:42px;height:42px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;display:grid;gap:4px;justify-items:center;opacity:.45}
.badge.on{opacity:1;border-style:solid;background:var(--surface)}
.badge svg{width:34px;height:34px}
.badge b{font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl{overflow-x:auto}
.sub{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;padding:6px 10px;text-decoration:none;color:var(--ink);max-width:100%}
.thumbs img{display:block;max-height:110px;width:auto;margin:-6px -10px}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.lb{display:grid;gap:6px}
.lb-row{display:grid;grid-template-columns:28px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:10px}
.lb-row.me{background:var(--sunk)}
.lb-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.kenj-out{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:12px;min-height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){.chips .chip.hide-sm{display:none}.stats b{font-size:22px}.word{grid-template-columns:auto minmax(0,1fr)}.word .lvl-act{grid-column:1/-1}}
</style>

<script type="text/plain" id="vocab">
#A1|introducing yourself|am, is, are · greeting and saying goodbye
name|what someone is called|My name is Steve.
meet|see someone for the first time|Nice to meet you.
from|showing where someone was born|I am from Texas.
live|have your home in a place|I live in New York.
teacher|a person who teaches|He is an English teacher.
goodbye|what you say when you leave|Goodbye, see you tomorrow.
#A2|numbers, colours and things around us|what is this? / what are these?
desk|a table for working or studying|My book is on the desk.
chair|a seat for one person|Please sit on the chair.
window|an opening in a wall with glass|Open the window, please.
yellow|the colour of the sun|The taxi is yellow.
eleven|the number 11|There are eleven students.
these|used for things near you (plural)|What are these? They are pens.
#A3|family and relationships|have · family members
parents|your mother and father|My parents live in Ankara.
sister|a girl with the same parents as you|I have one sister.
brother|a boy with the same parents as you|My brother is 17.
cousin|the child of your aunt or uncle|My cousin lives in London.
married|having a husband or wife|She is married with two kids.
grandmother|the mother of your mother or father|My grandmother is 80.
#A4|hobbies and interests|I like / I don't like · my favourite … is
hobby|something you enjoy in your free time|My hobby is reading.
favourite|the one you like most|My favourite colour is blue.
enjoy|get pleasure from something|I enjoy listening to music.
painting|making pictures with paint|She loves painting.
dislike|not like|I dislike cold weather.
interested|wanting to know more about something|I'm interested in music.
#A5|a usual day|present simple · after, before, when, until
wake up|stop sleeping|I wake up at 7 o'clock.
breakfast|the first meal of the day|I have breakfast at home.
usually|in most cases|I usually take the bus.
until|up to a certain time|I work until 6 pm.
commute|travel to and from work|My commute is 30 minutes.
routine|the things you do every day|Exercise is part of my routine.
#A6|houses, neighbourhood and town|asking and giving directions
neighbourhood|the area around your home|My neighbourhood is quiet.
turn left|go to the left side|Turn left at the bank.
straight|without turning|Go straight ahead.
corner|the place where two streets meet|The café is on the corner.
opposite|across from|The bank is opposite the park.
bus stop|a place where buses stop|The bus stop is near my house.
#A7|movies, music and books|likes, dislikes and preferences
prefer|like one thing more than another|I prefer books to movies.
comedy|a funny film|We watched a comedy.
novel|a long story in a book|She is reading a novel.
singer|a person who sings|Adele is my favourite singer.
boring|not interesting|The film was boring.
exciting|making you feel full of energy|It was an exciting book.
#A8|sports and abilities|can for abilities, requests and offers
can|be able to|I can swim.
swim|move through water|Can you swim?
team|a group that plays together|Our team won.
play|take part in a game|I play football on Sundays.
request|ask for something politely|Can you help me? It's a request.
offer|say you will do something for someone|Can I carry your bag? That's an offer.
#A9|favourite celebrities|nationality, job, character and appearance
famous|known by many people|She is a famous actress.
nationality|the country you belong to|His nationality is Spanish.
tall|more than average height|He is tall and slim.
friendly|kind and pleasant|She is very friendly.
actor|a person who acts in films|He is a Hollywood actor.
curly|with curls (hair)|She has curly hair.
#A10|cinema and TV|present simple wh- questions
channel|a TV station|What channel is the match on?
series|a TV show with many episodes|I watch a crime series.
episode|one part of a series|The new episode is tonight.
ticket|a paper that lets you enter|How much is a cinema ticket?
when|at what time|When does the film start?
why|for what reason|Why do you like that show?
#A11|business, workplaces and shopping|asking for and telling prices
price|how much money something costs|What is the price?
cashier|a person who takes money in a shop|Pay the cashier, please.
office|a place where people work|She works in an office.
pharmacy|a shop that sells medicine|The pharmacy is open.
receipt|a paper that shows what you paid|Can I have the receipt?
cheap|not costing much|This shirt is cheap.
#A12|food and drink|would like · some, any, a lot of
would like|want (polite)|I would like a coffee.
some|a number or amount of|I want some water.
any|used in questions and negatives|Do you have any milk?
menu|a list of food in a restaurant|Can I see the menu?
order|ask for food in a restaurant|Are you ready to order?
bill|a paper showing what you must pay|Can we have the bill?
#A13|shopping and money|how much … / how many …
how much|asking about price or amount|How much is this?
how many|asking about a number of things|How many apples do you have?
exchange|change money to another currency|I want to exchange dollars.
change|money you get back|Here is your change.
size|how big something is|What size do you need?
try on|put clothes on to check them|Can I try on this jacket?
#A14|kinds of food and restaurants|polite requests with will and would
reservation|a booking for a table|I have a reservation for two.
waiter|a person who serves food|The waiter brought our food.
dessert|sweet food after a meal|Would you like dessert?
complain|say that something is wrong|I want to complain about the soup.
cold|not warm|My soup is cold.
would you|a polite way to ask|Would you bring some water, please?
#A15|places, addresses and directions|prepositions of place
address|where someone lives|What's your address?
next to|beside|The bank is next to the school.
between|in the middle of two things|It's between the café and the shop.
crowded|full of people|The city centre is crowded.
historic|old and important|It's a historic city.
across|on the other side|The park is across the street.
#A16|transportation and vehicles|comparatives · buying tickets
taxi|a car you pay to ride in|Let's take a taxi.
faster|more fast|The train is faster than the bus.
cheaper|less expensive|The bus is cheaper than a taxi.
single ticket|a ticket for one way|A single ticket to London, please.
return ticket|a ticket there and back|I need a return ticket.
platform|where you get on a train|The train leaves from platform 3.
#A17|timetables and telling the time|adverbs of frequency
always|every time|I always drink tea in the morning.
often|many times|I often go to the gym.
sometimes|not always|I sometimes eat out.
never|at no time|I never smoke.
timetable|a list of times|Check the bus timetable.
quarter past|15 minutes after the hour|It's quarter past three.
#A18|phone conversations|accepting and refusing invitations
call|telephone someone|I'll call you later.
hold on|wait (on the phone)|Hold on, please.
invite|ask someone to come|I'd like to invite you to dinner.
accept|say yes to something|I accept your invitation.

#C28|marriage|general revision · relationships
commitment|a promise to be loyal|Marriage requires commitment.
propose|ask someone to marry you|He proposed on the beach.
divorce|the legal end of a marriage|They got a divorce.
relationship|a connection between people|They have a strong relationship.
compromise|an agreement where both sides give something|Every marriage needs compromise.
spouse|a husband or wife|Bring your spouse to the party.
#C29|details about the family|relative clauses · exaggerating words
whose|relative word for possession|That's the man whose son is a doctor.
extended family|relatives beyond parents and children|My extended family is huge.
absolutely|completely (for exaggeration)|It was absolutely amazing!
in-laws|your husband's or wife's family|My in-laws visit every Sunday.
a million times|many times (exaggeration)|I've told you a million times!
sibling|a brother or sister|I have three siblings.
#C30|a lesson about life|noun clauses
what matters|the important thing|What matters is being happy.
whether|if (with two choices)|I don't know whether he's coming.
the fact that|introduces a noun clause|The fact that he lied upset me.

<script src="level-access.js"></script>
<script>
(function(){
"use strict";
/* ---------- data ---------- */
const LEVELS={A:{name:"Level A",tag:"Beginner"},B:{name:"Level B",tag:"Intermediate"},C:{name:"Level C",tag:"Advanced"}};
const LESSONS=[];const BYID={};
(function parse(){
  let cur=null;
  document.getElementById('vocab').textContent.split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    if(line[0]==='#'){const [id,title,grammar]=line.slice(1).split('|');cur={id,level:id[0],n:+id.slice(1),title,grammar,words:[]};LESSONS.push(cur);BYID[id]=cur;return;}
    const [w,m,e]=line.split('|'); cur.words.push({w,m,e,key:cur.id+'-'+cur.words.length,lesson:cur.id});
  });
})();
const levelWords=l=>LESSONS.filter(x=>x.level===l).flatMap(x=>x.words);
const ALLWORDS=LESSONS.flatMap(x=>x.words);
const WORDBYKEY={};ALLWORDS.forEach(w=>WORDBYKEY[w.key]=w);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d);};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim();
const fmtDate=t=>{if(!t)return'';const d=new Date(t);return isNaN(d)?String(t):d.toLocaleDateString(undefined,{day:'numeric',month:'short'});};
const colorFor=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return 'hsl('+h+' 55% 45%)';};
const initials=n=>(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}

const I={ // small inline icons
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',

  fire:'<svg viewBox="0 0 24 24" fill="#f26b1d"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 10.5 11C10.5 7 12 2 12 2Z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="#f2b31b"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8Z"/></svg>',
  starOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8Z"/></svg>',
  brain:'<svg viewBox="0 0 24 24" fill="#2d5bff"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3h2V3Zm6 0a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3h-2V3Z"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9a6 6 0 1 1 12 0c0 4-4 4-4 8a3 3 0 0 1-6 0"/><path d="M10 9a2 2 0 1 1 4 0"/></svg>',
  match:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h4v10"/></svg>',
  gap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4M17 12h4"/><rect x="8" y="8" width="8" height="8" rx="1.5" stroke-dasharray="2 2"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>',
  medal:'<svg viewBox="0 0 24 24"><path d="M7 2h4l2 6H9Z" fill="#2d5bff"/><path d="M17 2h-4l-2 6h4Z" fill="#e2513d"/><circle cx="12" cy="15" r="6" fill="#f2b31b"/><circle cx="12" cy="15" r="3.5" fill="none" stroke="#5a3f00" stroke-width="1.2"/></svg>'
};

/* ---------- state ---------- */
const S={db:null,user:null,assets:null,sample:null,uid:null,name:'',teacher:false,canWrite:null,ready:false,
  prog:null,view:'learn',lesson:null,game:null,assignments:[],mySubs:[],classProg:[],profiles:{},subs:{},
  accent:lsGet('kenj-accent')||'en-GB',subFilter:'todo',
  accessCtl:null,accessCfg:{configured:false,reason:'missing',teacherEmails:[]},levelTeacher:false,teacherUnverified:false,teacherEmail:'',
  gate:'checking',fbUid:null,accessRequests:{},accessGrants:{},testGate:false,
  fb:null,lockSaving:false,testMemory:false};
function defaultProg(){return{xp:0,streak:0,best:0,lastDay:'',level:'A',cards:{},scores:{},days:{},games:0,perfect:0,hw:0,updatedAt:0};}
let LSKEY='kenj-prog';
function readLocal(k){try{return Object.assign(defaultProg(),JSON.parse(lsGet(k)||'{}'));}catch(e){return defaultProg();}}
S.prog=readLocal(LSKEY);
S.accessCtl=KenjLevelAccess.createController();
try{const cached=lsGet(KenjLevelAccess.CACHE_KEY);if(cached)S.accessCtl.restoreCache(JSON.parse(cached));}catch(e){}

let saveT=null;
function save(){
  lsSet(LSKEY,JSON.stringify(S.prog));
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!S.db||!S.uid||S.canWrite===false) return;
    S.prog.updatedAt=Date.now();
    try{await S.db.doc('progress/'+S.uid).set(S.prog);}
    catch(e){if(e&&e.code==='invalid_argument'){S.canWrite=false;render();}}
  },1200);
}
function accessFor(level){return S.accessCtl.accessFor(level);}
function accessSnap(){return S.accessCtl.snapshot();}
function persistAccessCache(){
  const payload=S.accessCtl.cachePayload();
  if(payload) lsSet(KenjLevelAccess.CACHE_KEY,JSON.stringify(payload));
  else try{localStorage.removeItem(KenjLevelAccess.CACHE_KEY);}catch(e){}
}
function clearAccessStored(){
  try{localStorage.removeItem(KenjLevelAccess.CACHE_KEY);localStorage.removeItem(KenjLevelAccess.FLAG_KEY);}catch(e){}
}
function onAccessChanged(){
  persistAccessCache();
  if(S.game&&!gameAllowed(S.game)){S.game=null;clearInterval(matchTimer);toast('Mr. Kenj locked this level. Your saved progress is kept.');}
  render();
}
function gameAllowed(g){
  if(!g) return false;
  if(g.scope==='review') return g.words.every(w=>accessFor(w.lesson[0]).open);
  return KenjLevelAccess.canStartScope(g.scope,S.prog.level,lv=>accessFor(lv)).open;
}
function openTricky(){return KenjLevelAccess.filterWordsByAccess(trickyWords(),lv=>accessFor(lv));}
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;s.onload=()=>resolve();s.onerror=()=>reject(new Error('missing'));
    document.head.appendChild(s);
  });
}
function accessBanner(){
  const st=accessSnap();
  if(st.mode==='booting'||st.mode==='checking') return '<div class="banner" id="level-access-status">Checking which levels Mr. Kenj has opened. Lessons stay closed until that check finishes.</div>';
  if(st.mode==='unconfigured'){
    const teacher=S.accessCfg.teacherEmails&&S.accessCfg.teacherEmails[0];
    const why=S.accessCfg.reason==='disabled'&&S.accessCfg.firebaseReady&&teacher?'Firebase web settings are saved and '+esc(teacher)+' is the only teacher address. Level locks stay switched off until sign-in, Firestore, and the security rules are in place.':
      S.accessCfg.reason==='disabled'&&S.accessCfg.firebaseReady?'Firebase web settings are saved, but level locks are switched off until a teacher is listed and the security rules are deployed.':
      S.accessCfg.reason==='disabled'?'The settings file is present, but level locks are turned off.':
      S.accessCfg.reason==='placeholder'?'The settings file still has placeholder text, so level locks are not connected.':
      S.accessCfg.reason==='no-teacher-email'?'The settings file has no teacher email yet, so level locks are not connected.':
      'Level locks are not connected yet.';
    return '<div class="banner" id="level-access-status">'+why+' Every level is open on this device only. This is not a setting for the whole class.</div>';
  }
  if(st.mode==='unknown') return '<div class="banner" id="level-access-status">The class level settings could not be loaded, and this device has not seen them before. Lessons stay available here until the first successful check. The class settings have not been changed.</div>';
  if(st.mode==='cached') return '<div class="banner" id="level-access-status">Showing the last level settings saved on this device. A locked level stays locked until a newer update arrives.</div>';
  return '';
}
function lockedMessage(level,gate,lesson){
  const name=LEVELS[level].name;
  const waiting=gate.reason==='checking';
  const title=waiting?name+' is waiting':name+' is locked';
  const msg=waiting?name+' cannot be opened until the class settings have loaded.':
    name+' is locked. Mr. Kenj has closed this level for every student. Your words, scores and points are still saved. Passing a lesson does not open a locked level.';
  const where=lesson?'<p class="muted" style="margin:0">The link you opened is lesson '+lesson.n+' in '+esc(name)+'.</p>':'';
  return '<div class="panel lock-panel lv-'+level+'" id="level-locked"><div class="eyebrow">Level access</div><h3 style="font-size:22px">'+title+'</h3><p style="margin:0">'+msg+'</p>'+where+'</div>';
}
function levelLockButtons(){
  const st=accessSnap();
  const locks=st.locks||KenjLevelAccess.emptyLocks();
  return '<div class="switch-row" role="group" aria-label="Level locks for every student">'+KenjLevelAccess.LEVEL_IDS.map(k=>{
    const locked=!!locks[k];
    return '<button type="button" class="btn lv-'+k+'" data-act="toggle-lock" data-l="'+k+'" aria-pressed="'+locked+'"'+(st.canSave&&S.levelTeacher&&!S.lockSaving?'':' disabled')+'>'+LEVELS[k].name+'<small>'+(locked?'Locked':'Open')+'</small></button>';
  }).join('')+'</div>';
}
function viewLevelAccessPanel(){
  const st=accessSnap();
  if(!st.configured){
    const project=S.accessCfg.firebaseReady&&S.accessCfg.projectId?esc(S.accessCfg.projectId):'';
    const teacher=S.accessCfg.teacherEmails&&S.accessCfg.teacherEmails[0]?esc(S.accessCfg.teacherEmails[0]):'';
    const reason=project&&teacher?'Firebase web settings are saved for '+project+'. The only account that can write, once the rules are deployed, is '+teacher+'. Level locks are not live, so no lock switch is shown. Sign-in and Firestore are not ready, and these rules have not been deployed.':
      project?'Firebase web settings are saved for '+project+'. Level locks are not live, so no lock switch is shown. No teacher email or user id is listed. Writes stay denied until that teacher is added here and in the security rules, and those rules are deployed.':
      S.accessCfg.reason==='disabled'?'A settings file is present, but level locks are turned off. No lock switch is shown.':
      S.accessCfg.reason==='placeholder'?'The settings file still has placeholder text, so it is not connected. No lock switch is shown.':
      S.accessCfg.reason==='no-teacher-email'?'The settings file has no real teacher email yet, so it is not connected. No lock switch is shown.':
      'Level locks are not connected. There is no shared store for this copy, so no lock switch is shown. A switch kept in this browser would not change other students\' devices.';
    const follow=project?'Every level stays open on this device. Passing a lesson does not open a locked level. The remaining steps are in docs/level-access.md.':'Level locks for every student need a shared store. Saved progress stays on each device. Passing a lesson does not open a locked level. The setup steps are in docs/level-access.md.';
    return '<div class="panel" id="level-access-panel"><div class="eyebrow">Level access</div><h3 style="font-size:20px">Class level locks are not live</h3><p style="margin:0">'+reason+'</p><p style="margin:8px 0 0">'+follow+'</p><p class="small muted" style="margin:8px 0 0">This app is a public web page. A lock can close a level inside the app. It cannot stop someone from reading the page file.</p></div>';
  }
  let body='';
  if(st.mode==='checking'||st.mode==='booting') body+='<p style="margin:0">Current settings are still loading. Switches stay off until they load, so a blank page cannot overwrite the class.</p>';
  else if(!st.canSave) body+='<p style="margin:0">Changes wait until the settings store is connected, so an offline save cannot overwrite the class. A locked level stays locked.</p>';
  if(S.teacherUnverified){
    body+='<div class="banner" id="teacher-unverified"><b>Confirm this address before changing locks.</b> Signed in as '+esc(S.teacherEmail)+'. Firebase has not confirmed this address yet, so this account cannot write the class settings. Open the confirmation message, then choose I have confirmed it. Level locks stay unchanged until then.</div><div class="row" style="margin-top:8px"><button class="btn primary" type="button" data-act="send-verify">Send confirmation email</button><button class="btn" type="button" data-act="recheck-verify">I have confirmed it</button><button class="btn sm" type="button" data-act="level-sign-out">Sign out</button></div>';
  }else if(!S.levelTeacher){
    body+='<p style="margin:8px 0 0">Sign in with the teacher email to change these locks. Students cannot change them.</p>';
    if(st.reason==='unavailable'||S.accessCfg.reason==='unavailable') body+='<p class="small muted" style="margin:8px 0 0">Teacher sign-in needs the settings file, which did not load. Locked levels stay locked.</p>';
    else body+=signInFields('Teacher email');
  }else{
    body+='<p style="margin:8px 0">Signed in as '+esc(S.teacherEmail)+'. These switches are one setting for every student.</p>'+levelLockButtons()+accessAdminHtml()+'<div style="margin-top:8px"><button class="btn sm" type="button" data-act="level-sign-out">Sign out</button></div>';
  }
  if(st.locks){
    body+='<p class="small muted" style="margin:8px 0 0">'+KenjLevelAccess.LEVEL_IDS.map(k=>LEVELS[k].name+': '+(st.locks[k]?'locked':'open')).join(' · ')+(st.updatedAt?' · updated '+fmtDate(st.updatedAt):'')+'</p>';
  }
  return '<div class="panel" id="level-access-panel"><div class="eyebrow">Level access</div><h3 style="font-size:20px">Levels for every student</h3>'+body+'</div>';
}
let testChannel=null;
let accessUnsub=null,grantUnsub=null,requestListUnsub=null,grantListUnsub=null;
function listenTestChannel(){
  if(testChannel||!S.testMemory) return;
  try{
    testChannel=new BroadcastChannel('kenj-level-access-test');
    testChannel.onmessage=ev=>{if(!ev||!ev.data)return;S.accessCtl.applySnapshot(ev.data,Date.now());onAccessChanged();};
  }catch(e){}
}
function publishTest(data){try{listenTestChannel();testChannel&&testChannel.postMessage(data);}catch(e){}}
async function saveLevelLocks(next){
  if(!S.levelTeacher){toast('Only a signed-in teacher can change level locks.');return;}
  let payload;
  try{payload=KenjLevelAccess.buildLockDocument(next,S.teacherEmail,S.accessCfg.teacherEmails,Date.now());}
  catch(e){toast(e&&e.code==='not-teacher'?'Only a listed teacher can change level locks.':'Could not prepare that change.');return;}
  if(S.testMemory){S.accessCtl.applySnapshot(payload,Date.now());publishTest(payload);onAccessChanged();toast('Level locks saved on this test page.');return;}
  if(!S.fb||!accessSnap().canSave){toast('Wait until the class settings have loaded before saving.');return;}
  S.lockSaving=true;render();
  try{await S.fb.setDoc(S.fb.doc(S.fb.db,'settings','levelAccess'),payload);toast('Level locks saved for every student.');}
  catch(e){
    const code=e&&(e.code||'');
    toast(code.indexOf('permission-denied')!==-1?'The server refused the change. Check that this email is in the security rules.':'Could not save the level locks. Existing locks stay as they are.');
  }finally{S.lockSaving=false;render();}
}
function stopAccessWatch(){
  if(grantUnsub){grantUnsub();grantUnsub=null;}
  if(requestListUnsub){requestListUnsub();requestListUnsub=null;}
  if(grantListUnsub){grantListUnsub();grantListUnsub=null;}
}
function applyStoredGrant(uid,status){
  const decision=KenjLevelAccess.accessDecision({signedIn:true,emailVerified:true,isTeacher:false,grantStatus:status||'',readFailed:false});
  S.gate=decision;
  rememberAccess(uid,decision==='approved'?'approved':decision==='revoked'?'revoked':'pending');
  if(!studyAllowed()) S.game=null;
  render();
}
function failGrantRead(uid){
  const remembered=rememberedAccess(uid);
  S.gate=KenjLevelAccess.accessDecision({signedIn:true,emailVerified:true,isTeacher:false,readFailed:true,remembered:remembered});
  if(!studyAllowed()) S.game=null;
  render();
}
async function watchStudent(user){
  stopAccessWatch();
  const uid=user.uid;
  const req=S.fb.doc(S.fb.db,'accessRequests',uid);
  try{
    const existing=await S.fb.getDoc(req);
    if(!existing.exists()) await S.fb.setDoc(req,{email:String(user.email).trim().toLowerCase(),requestedAt:Date.now()});
  }catch(e){}
  if(S.fbUid!==uid) return;
  grantUnsub=S.fb.onSnapshot(S.fb.doc(S.fb.db,'accessGrants',uid),snap=>{
    if(S.testGate||S.fbUid!==uid) return;
    const status=snap.exists()&&snap.data()?snap.data().status:'';
    applyStoredGrant(uid,status);
  },()=>{if(!S.testGate&&S.fbUid===uid) failGrantRead(uid);});
}
function watchTeacher(){
  stopAccessWatch();
  requestListUnsub=S.fb.onSnapshot(S.fb.collection(S.fb.db,'accessRequests'),snap=>{
    S.accessRequests={};snap.forEach(d=>{S.accessRequests[d.id]=d.data()||{};});
    if(S.gate==='teacher'&&S.view==='teacher'&&!S.game) render();
  },()=>{});
  grantListUnsub=S.fb.onSnapshot(S.fb.collection(S.fb.db,'accessGrants'),snap=>{
    S.accessGrants={};snap.forEach(d=>{S.accessGrants[d.id]=d.data()||{};});
    if(S.gate==='teacher'&&S.view==='teacher'&&!S.game) render();
  },()=>{});
}
function handleAuthUser(user){
  if(S.testGate) return;
  if(!user){
    stopAccessWatch();bindFirebaseProgress(null);
    S.gate='signed-out';S.levelTeacher=false;S.teacherUnverified=false;S.teacherEmail='';S.game=null;render();return;
  }
  const listed=KenjLevelAccess.isTeacherEmail(user.email,S.accessCfg.teacherEmails);
  const verified=user.emailVerified===true;
  bindFirebaseProgress(user.uid);
  S.teacherEmail=String(user.email||'').trim().toLowerCase();
  if(!verified){
    stopAccessWatch();S.gate='unverified';S.teacherUnverified=true;S.levelTeacher=false;S.game=null;render();return;
  }
  S.teacherUnverified=false;
  if(listed){S.gate='teacher';S.levelTeacher=true;watchTeacher();render();return;}
  S.levelTeacher=false;S.gate='checking';render();watchStudent(user);
}
function accessAdminHtml(){
  if(S.gate!=='teacher') return '';
  const ids=Object.keys(S.accessRequests||{});
  let rows=ids.length?ids.map(uid=>{
    const req=S.accessRequests[uid]||{};
    const grant=S.accessGrants&&S.accessGrants[uid];
    const status=grant&&grant.status==='approved'?'Approved':grant&&grant.status==='revoked'?'Removed':'Waiting';
    return '<div class="sub" id="access-row-'+esc(uid)+'"><div class="row" style="justify-content:space-between"><b>'+esc(req.email||'Student')+'</b><span class="pill">'+status+'</span></div><div class="row"><button class="btn sm primary" type="button" data-act="approve-student" data-uid="'+esc(uid)+'">Approve</button><button class="btn sm" type="button" data-act="revoke-student" data-uid="'+esc(uid)+'">Remove access</button></div></div>';
  }).join(''):'<p class="muted" style="margin:0">No one has asked to join yet.</p>';
  return '<div id="access-admin" style="display:grid;gap:8px;margin-top:12px"><h3 style="font-size:18px">Student access</h3><p class="small muted" style="margin:0">Only people you approve can study. You see the email they signed in with, and nothing more.</p>'+rows+'</div>';
}
async function setStudentGrant(uid,status){
  if(S.gate!=='teacher'||!S.fb){toast('Only the confirmed teacher can change access.');return;}
  try{
    await S.fb.setDoc(S.fb.doc(S.fb.db,'accessGrants',uid),{status:status,updatedAt:Date.now(),updatedBy:S.teacherEmail});
    toast(status==='approved'?'Student approved.':'Access removed.');
  }catch(e){toast('Could not update access. The class rules were not changed.');}
}
function teacherAuthMessage(code){
  if(code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found'||code==='auth/invalid-email') return 'That email or password was not recognised.';
  if(code==='auth/too-many-requests') return 'Too many sign-in attempts. Wait a moment and try again.';

async function startLevelAccess(){
  let config=null,loaded=false;
  try{await loadScript('level-access.config.js');config=window.KENJ_LEVEL_ACCESS||null;loaded=true;}catch(e){loaded=false;}
  const wasConfigured=lsGet(KenjLevelAccess.FLAG_KEY)==='1';
  const decision=KenjLevelAccess.resolveBoot({configLoaded:loaded,config:config,wasConfigured:wasConfigured});
  S.accessCfg=decision.status;
  if(!decision.configured){
    clearAccessStored();
    S.accessCtl.noteUnconfigured();
    S.gate='blocked';
    render();
    return;
  }
  S.accessCtl.noteConfigured();
  if(decision.status.reason==='ready') lsSet(KenjLevelAccess.FLAG_KEY,'1');
  if(decision.status.reason==='unavailable'&&!accessSnap().locks) S.accessCtl.applyError({code:'unavailable'},Date.now());
  render();
  if(decision.status.reason!=='ready') return;
  try{
    const appMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const authMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    const fsMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    const app=appMod.initializeApp(config.firebase);
    const auth=authMod.getAuth(app);
    const db=fsMod.getFirestore(app);
    S.fb={app:app,auth:auth,db:db,doc:fsMod.doc,getDoc:fsMod.getDoc,setDoc:fsMod.setDoc,collection:fsMod.collection,onSnapshot:fsMod.onSnapshot,signIn:authMod.signInWithEmailAndPassword,signOut:authMod.signOut,sendVerification:authMod.sendEmailVerification,resetPassword:authMod.sendPasswordResetEmail};
    const ref=fsMod.doc(db,'settings','levelAccess');
    if(accessUnsub){accessUnsub();accessUnsub=null;}
    accessUnsub=fsMod.onSnapshot(ref,snap=>{
      const fromCache=!!(snap.metadata&&snap.metadata.fromCache);
      if(!snap.exists()){if(!fromCache)S.accessCtl.applyMissing(Date.now());}
      else S.accessCtl.applySnapshot(snap.data(),Date.now(),{fromCache:fromCache});
      onAccessChanged();
    },err=>{S.accessCtl.applyError(err,Date.now());onAccessChanged();});
    authMod.onAuthStateChanged(auth,user=>{handleAuthUser(user);});
    setTimeout(()=>{if(accessSnap().mode==='checking'){S.accessCtl.applyError({code:'timeout'},Date.now());onAccessChanged();}},12000);
  }catch(e){S.accessCtl.applyError(e,Date.now());S.gate='blocked';onAccessChanged();}
}
function touchDay(){
  const t=ymd();
  if(S.prog.lastDay!==t){S.prog.streak=(S.prog.lastDay===daysAgo(1))?S.prog.streak+1:1;S.prog.lastDay=t;S.prog.best=Math.max(S.prog.best||0,S.prog.streak);}
}
function addXP(n){
  touchDay();S.prog.xp+=n;const t=ymd();S.prog.days[t]=(S.prog.days[t]||0)+n;
  const keys=Object.keys(S.prog.days).sort();while(keys.length>40){delete S.prog.days[keys.shift()];}
  save();renderChips();
}
function liveStreak(p){return (p.lastDay===ymd()||p.lastDay===daysAgo(1))?p.streak:0;}
const box=k=>S.prog.cards[k]||0;

const lessonMastered=l=>l.words.filter(w=>box(w.key)>=3).length;

  '<div class="field"><label for="kenj-in">'+(w?'Write your own sentence with this word':'Write a sentence and Mr. Kenj will check it')+'</label><textarea id="kenj-in" placeholder="'+(w?'My sentence…':'Yesterday I have went to the cinema.')+'"></textarea></div>'+
  '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="kenj"'+(w?' data-key="'+w.key+'"':'')+'>Check it</button></div><div class="kenj-out" id="kenj-out" style="margin-top:10px" hidden></div></div>';
}

/* ---------- GAMES ---------- */
function scopeWords(scope){
  if(scope==='review') return shuffle(openTricky()).slice(0,12);
  if(scope==='level') return shuffle(levelWords(S.prog.level)).slice(0,12);
  return shuffle(BYID[scope].words);
}
function scopeLabel(scope){return scope==='review'?'Tricky words':scope==='level'?LEVELS[S.prog.level].name+' mix':'Lesson '+BYID[scope].n+' · '+BYID[scope].title;}
function startGame(type,scope){
  const gate=KenjLevelAccess.canStartScope(scope,S.prog.level,lv=>accessFor(lv));
  if(!gate.open){toast(gate.reason==='checking'?'Wait while level access is checked.':'That level is locked. Your progress is kept.');return;}
  if(scope==='review'&&!openTricky().length){toast(trickyWords().length?'Those words are in a locked level. Your progress is kept.':'No words to practise yet.');return;}
  let words=scopeWords(scope);
  if(!words.length){toast('No words to practise yet.');return;}
  const lvl=scope==='review'||scope==='level'?S.prog.level:BYID[scope].level;
  const pool=scope==='review'?ALLWORDS.filter(w=>accessFor(w.lesson[0]).open):levelWords(lvl);
  if(type==='spell') words=words.filter(w=>/^[a-z' -]+$/i.test(w.w)&&w.w.length<=22);
  if(type==='gap') words=words.filter(w=>norm(w.e).includes(norm(w.w)));
  if(type==='match') words=words.slice(0,6);
  if(!words.length){toast('This set has no words for that game. Try another one.');return;}
  S.game={type,scope,words,pool,i:0,score:0,xp:0,done:false,answered:false,flipped:false,start:Date.now(),sel:null,matched:[],tries:0};
  if(type==='quiz'||type==='gap') S.game.opts=words.map(w=>makeOpts(w,pool,type));
  if(type==='match'){S.game.left=shuffle(words);S.game.right=shuffle(words);}
  render();window.scrollTo(0,0);
}
function makeOpts(w,pool,type){
  const f=type==='quiz'?'m':'w';const seen=new Set([norm(w[f])]);const out=[w];
  for(const o of shuffle(pool)){if(out.length>=4)break;if(!seen.has(norm(o[f]))){seen.add(norm(o[f]));out.push(o);}}
  return shuffle(out);
}
function gameHead(){
  const g=S.game,tot=g.words.length,names={flash:'Flashcards',quiz:'Quick quiz',spell:'Listen & spell',match:'Match up',gap:'Fill the gap',say:'Say it'};
  const pos=g.type==='match'?g.matched.length:g.i;
  return '<div class="game-top"><button class="icon-btn" aria-label="Exit game" data-act="exit">'+I.back+'</button><div style="min-width:0;flex:none"><div class="eyebrow">'+esc(scopeLabel(g.scope))+'</div><b style="font-family:var(--display);font-size:18px">'+names[g.type]+'</b></div>'+
  '<div class="meter"><i style="width:'+(pos/tot*100)+'%"></i></div><span class="chip">'+Math.min(pos+(g.type==='match'?0:1),tot)+'/'+tot+'</span></div>';
}
function renderGame(){
  const g=S.game;if(g.done) return renderResult();
  const w=g.words[g.i];let b='';
  if(g.type==='flash'){
    b='<div class="flash'+(g.flipped?' flipped':'')+'" data-act="flip" role="button" tabindex="0" aria-label="Flip card"><div class="flash-inner"><div class="face front icard"><span class="eyebrow">Tap to see the meaning</span><span class="big-word">'+esc(w.w)+'</span></div>'+
      '<div class="face back icard"><span class="big-word" style="font-size:28px">'+esc(w.w)+'</span><span style="font-size:19px">'+esc(w.m)+'</span><em>“'+esc(w.e)+'”</em></div></div></div>'+
      '<div class="row" style="justify-content:center"><button class="btn" data-act="say" data-t="'+esc(w.w)+'">'+I.speak.replace('<svg','<svg width="18" height="18"')+' Listen</button><button class="btn" data-act="say" data-t="'+esc(w.e)+'" data-r="0.8">Example</button></div>'+
      '<div class="row" style="justify-content:center"><button class="btn" data-act="flash-ans" data-k="0" style="border-color:var(--bad)">Still learning</button><button class="btn primary" data-act="flash-ans" data-k="1">I know it</button></div>';
  } else if(g.type==='quiz'||g.type==='gap'){
    const q=g.type==='quiz'?'<div class="icard" style="text-align:center"><div class="eyebrow">What does this mean?</div><div class="row" style="justify-content:center"><span class="big-word">'+esc(w.w)+'</span><button class="icon-btn" aria-label="Listen" data-act="say" data-t="'+esc(w.w)+'">'+I.speak+'</button></div></div>'
      :'<div class="icard"><div class="eyebrow">Choose the missing words</div><p style="font-size:22px;line-height:28px;margin:8px 0 0">'+gapSentence(w)+'</p></div>';
    b=q+'<div class="opts">'+g.opts[g.i].map((o,j)=>'<button class="opt" data-act="pick" data-j="'+j+'">'+esc(g.type==='quiz'?o.m:o.w)+'</button>').join('')+'</div><div class="feedback" id="fb"></div>';
  } else if(g.type==='spell'){
    b='<div class="icard" style="text-align:center;display:grid;gap:12px;justify-items:center"><div class="eyebrow">Listen and type the word</div><div class="row"><button class="btn primary" data-act="say" data-t="'+esc(w.w)+'">'+I.speak.replace('<svg','<svg width="18" height="18"')+' Play</button><button class="btn" data-act="say" data-t="'+esc(w.w)+'" data-r="0.55">Slow</button><button class="btn ghost" data-act="hint">Hint</button></div><div class="muted" id="hint">Meaning: '+esc(w.m)+'</div></div>'+
      '<form id="spell-form" class="grid" style="gap:10px"><input type="text" class="spell-in" id="spell-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the word"><button class="btn primary" type="submit" style="justify-content:center">Check</button></form><div class="feedback" id="fb"></div>';
  } else if(g.type==='match'){
    const secs=Math.round((Date.now()-g.start)/1000);
    b='<p class="muted" style="margin:0">Tap a word, then its meaning. <span id="timer" class="chip">'+secs+'s</span></p><div class="match"><div class="col">'+g.left.map(x=>'<button class="tile'+(g.matched.includes(x.key)?' done':'')+(g.sel===x.key?' sel':'')+'" data-act="m-left" data-k="'+x.key+'"><b>'+esc(x.w)+'</b></button>').join('')+'</div>'+
      '<div class="col">'+g.right.map(x=>'<button class="tile'+(g.matched.includes(x.key)?' done':'')+'" data-act="m-right" data-k="'+x.key+'">'+esc(x.m)+'</button>').join('')+'</div></div>';
  } else if(g.type==='say'){
    b='<div class="icard" style="text-align:center;display:grid;gap:10px;justify-items:center"><div class="eyebrow">Listen, then say it out loud 3 times</div><span class="big-word">'+esc(w.w)+'</span><span class="muted">'+esc(w.m)+'</span>'+
      '<div class="row" style="justify-content:center"><button class="btn primary" data-act="say" data-t="'+esc(w.w)+'">'+I.speak.replace('<svg','<svg width="18" height="18"')+' Word</button><button class="btn" data-act="say" data-t="'+esc(w.w)+'" data-r="0.5">Slow</button><button class="btn" data-act="say" data-t="'+esc(w.e)+'" data-r="0.85">Sentence</button></div><em>“'+esc(w.e)+'”</em></div>'+
      '<div class="row" style="justify-content:center"><button class="btn" data-act="say-ans" data-k="0">Need more practice</button><button class="btn primary" data-act="say-ans" data-k="1">I said it well</button></div>'+(S.sample?kenjBox(w):'');
  }
  return '<section class="game">'+gameHead()+b+'</section>';
}
function gapSentence(w){
  const n=norm(w.w);const words=w.e.split(' ');
  for(let s=0;s<words.length;s++)for(let e=s+1;e<=words.length;e++){if(norm(words.slice(s,e).join(' '))===n){
    const tail=(words[e-1].match(/[.,!?;:]+$/)||[''])[0];
    return esc(words.slice(0,s).join(' '))+' <span style="display:inline-block;min-width:90px;border-bottom:3px solid var(--accent)">&nbsp;</span>'+esc(tail)+' '+esc(words.slice(e).join(' '));}}
  return esc(w.e.replace(new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'_____'));
}
let matchTimer=null;
function afterGameRender(){
  clearInterval(matchTimer);
  const g=S.game;if(!g||g.done)return;
  if(g.type==='match') matchTimer=setInterval(()=>{const t=$('#timer');if(!t||!S.game||S.game.done){clearInterval(matchTimer);return;}t.textContent=Math.round((Date.now()-S.game.start)/1000)+'s';},1000);
  if(g.type==='spell'){const inp=$('#spell-in');if(inp)inp.focus();setTimeout(()=>speak(g.words[g.i].w),250);}
}
function next(){const g=S.game;g.i++;g.answered=false;g.flipped=false;if(g.i>=g.words.length)finish();else render();}
function grade(w,ok){if(ok){setBox(w.key,box(w.key)+1);S.game.score++;S.game.xp+=10;}else setBox(w.key,0);}
function finish(){
  const g=S.game;if(!g)return;
  if(!gameAllowed(g)){S.game=null;clearInterval(matchTimer);toast('That level is locked. This result was not saved as a new score.');render();return;}
  g.done=true;const tot=g.words.length;g.pct=Math.round(g.score/tot*100);
  g.xp+=20;if(g.pct===100){g.xp+=20;S.prog.perfect=(S.prog.perfect||0)+1;}
  S.prog.games=(S.prog.games||0)+1;
  if(g.scope!=='level'&&g.scope!=='review'&&g.type!=='flash'&&g.type!=='say') S.prog.scores[g.scope]=Math.max(S.prog.scores[g.scope]||0,g.pct);
  addXP(g.xp);render();
}
function renderResult(){
  const g=S.game,stars=g.pct>=90?3:g.pct>=60?2:g.pct>0?1:0;
  const msg=g.pct===100?'Perfect! Mr. Kenj is proud of you.':g.pct>=80?'Great job!':g.pct>=50?'Good effort. Try again to beat your score.':'Keep going, practice makes perfect.';
  const extra=g.type==='match'?'<p class="muted" style="margin:0">Time: '+g.secs+' seconds · '+g.tries+' tries</p>':'';
  return '<section class="game"><div class="panel result"><div class="stars">'+[0,1,2].map(i=>i<stars?I.star:I.starOff).join('')+'</div><h2 style="font-size:32px">'+g.pct+'%</h2><p style="margin:0;font-size:18px">'+msg+'</p>'+extra+
    '<span class="chip">'+I.star+'+'+g.xp+' XP</span><div class="row" style="justify-content:center"><button class="btn primary" data-act="play" data-g="'+g.type+'" data-scope="'+g.scope+'">Play again</button><button class="btn" data-act="exit">Done</button></div></div></section>';
}

/* ---------- HOMEWORK ---------- */
function viewHomework(){
  if(!S.db) return '<section class="panel"><h2 style="font-size:24px">Homework</h2><p class="muted">Homework needs the shared version of the app. Open Mr. Kenj\'s link while signed in.</p></section>';
  const subsBy={};S.mySubs.forEach(s=>{(subsBy[s.assignmentId]=subsBy[s.assignmentId]||[]).push(s);});
  const today=ymd();
  const list=S.assignments.slice().sort((a,b)=>String(a.due||'9').localeCompare(String(b.due||'9')));
  let h='<section class="grid" style="gap:18px"><div><h2 style="font-size:26px">Homework</h2><p class="muted" style="margin:4px 0 0">Upload photos of your workbook, PDFs or short videos. Mr. Kenj will grade them and leave feedback here.</p></div>';
  h+= list.length?'<div class="grid g2">'+list.map(a=>{
    const mine=subsBy[a.id]||[],last=mine[0];const late=a.due&&a.due<today;
    const status=last?(last.grade?'<span class="pill good">Graded: '+esc(last.grade)+'</span>':'<span class="pill">Handed in '+fmtDate(last.at)+'</span>'):late?'<span class="pill bad">Overdue</span>':'<span class="pill warn">To do</span>';
    const L=a.lesson&&BYID[a.lesson];
    return '<div class="panel" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><span class="eyebrow">'+(a.due?'Due '+fmtDate(a.due):'No due date')+(L?' · '+LEVELS[L.level].name+' L'+L.n:'')+'</span>'+status+'</div><h3 style="font-size:20px">'+esc(a.title)+'</h3>'+
      (a.details?'<p style="margin:0;white-space:pre-wrap">'+esc(a.details)+'</p>':'')+
      (L?'<div><button class="btn sm" data-act="open-lesson" data-id="'+L.id+'" data-go="learn">'+(accessFor(L.level).reason==='locked'?LEVELS[L.level].name+' is locked':'Open lesson '+L.n)+'</button></div>':'')+
      (last&&last.feedback?'<div class="banner"><b>Mr. Kenj:</b> '+esc(last.feedback)+'</div>':'')+
      handInForm(a.id)+'</div>';}).join('')+'</div>'
    :'<div class="panel muted">No homework yet. When Mr. Kenj sets homework it appears here. You can still send extra work below.</div>';
  h+='<div class="panel" style="display:grid;gap:10px"><h3 style="font-size:20px">Send extra work</h3><p class="muted small" style="margin:0">Practised something on your own? Send it to Mr. Kenj.</p>'+handInForm('free')+'</div>';
  if(S.mySubs.length) h+='<div><h3 style="font-size:20px;margin-bottom:10px">My submissions</h3><div class="grid g2">'+S.mySubs.map(subCard).join('')+'</div></div>';
  return h+'</section>';
}
function handInForm(aid){
  return '<form class="grid hw-form" data-aid="'+aid+'" style="gap:8px"><div class="field"><label for="f-'+aid+'">Files (photos, PDF or video)</label><input type="file" id="f-'+aid+'" multiple accept="image/*,application/pdf,video/*,.txt"'+(S.assets?'':' disabled')+'></div>'+
  (S.assets?'':'<span class="small muted">File upload needs Contributor access. You can still send a written answer.</span>')+
  '<div class="field"><label for="n-'+aid+'">Your answer or a note</label><textarea id="n-'+aid+'" placeholder="Write your answer or a message to Mr. Kenj"></textarea></div><div><button class="btn primary" type="submit">Hand in</button></div></form>';
}
function filesHtml(files){
  if(!files||!files.length) return '';
  return '<div class="thumbs">'+files.map(f=>{const u='/_blob/'+encodeURIComponent(f.id);
    return /^image\//.test(f.type)?'<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="'+esc(f.name)+'"></a>':'<a href="'+u+'" target="_blank" rel="noopener">'+esc(f.name)+'</a>';}).join('')+'</div>';
}
function subCard(s){
  return '<div class="sub"><div class="row" style="justify-content:space-between"><b>'+esc(s.title||'Extra work')+'</b>'+(s.grade?'<span class="pill good">'+esc(s.grade)+'</span>':'<span class="pill">Waiting for feedback</span>')+'</div>'+
    '<span class="small muted">Handed in '+fmtDate(s.at)+'</span>'+(s.note?'<p style="margin:0;white-space:pre-wrap">'+esc(s.note)+'</p>':'')+filesHtml(s.files)+
    (s.feedback?'<div class="banner"><b>Mr. Kenj:</b> '+esc(s.feedback)+'</div>':'')+'</div>';
}
async function handIn(form){
  const aid=form.dataset.aid,fileIn=form.querySelector('input[type=file]'),note=form.querySelector('textarea').value.trim();
  const btn=form.querySelector('button[type=submit]');
  const files=fileIn&&fileIn.files?Array.from(fileIn.files):[];
  if(!files.length&&!note){toast('Add a file or write an answer first.');return;}
  if(!S.uid){toast('Sign in to hand in homework.');return;}
  btn.disabled=true;btn.textContent='Uploading…';
  try{
    const up=[];
    for(const f of files){
      if(f.size>20*1024*1024){toast(f.name+' is larger than 20 MB. Please send a smaller file.');continue;}
      const r=await S.assets.upload(f);up.push({id:r.id,name:f.name,type:r.contentType||f.type});
    }
    const a=S.assignments.find(x=>x.id===aid);
    await S.db.collection('submissions/'+S.uid+'/items').add({assignmentId:aid,title:a?a.title:'Extra work',note,files:up,at:Date.now(),grade:'',feedback:''});
    S.prog.hw=(S.prog.hw||0)+1;addXP(50);toast('Handed in! +50 XP');
  }catch(e){toast(e&&e.code==='not_granted'?'You need Contributor access to upload files.':'Could not hand in: '+((e&&e.message)||'please try again'));}
  finally{btn.disabled=false;btn.textContent='Hand in';}
}

/* ---------- PROGRESS ---------- */
function viewProgress(){
  const p=S.prog;
  const days=[];for(let i=13;i>=0;i--){const d=daysAgo(i);days.push([d,p.days[d]||0]);}
  const max=Math.max(50,...days.map(d=>d[1]));const W=560,H=170,pl=34,pb=22,bw=(W-pl)/14;
  const ticks=[0,Math.round(max/2),max];
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="XP earned in the last 14 days">';
  ticks.forEach(t=>{const y=H-pb-(t/max)*(H-pb-10);svg+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+t+'</text>';});
  days.forEach(([d,v],i)=>{const bh=(v/max)*(H-pb-10);const x=pl+i*bw+bw*.18;svg+='<rect x="'+x+'" y="'+(H-pb-bh)+'" width="'+(bw*.64)+'" height="'+Math.max(bh,0)+'" rx="3" fill="'+(i===13?'var(--accent)':'color-mix(in srgb, var(--accent) 45%, transparent)')+'"><title>'+d+': '+v+' XP</title></rect>';
    if(i%2===1||i===13)svg+='<text x="'+(x+bw*.32)+'" y="'+(H-6)+'" text-anchor="middle">'+(i===13?'Today':new Date(d+'T12:00').getDate())+'</text>';});
  svg+='</svg>';
  const lv=Object.keys(LEVELS).map(k=>{const tot=levelWords(k).length,m=masteredCount(p,k),ps=lessonsPassed(p,k);
    const note=accessFor(k).reason==='locked'?' · Locked':'';
    return '<div class="lv-'+k+'" style="display:grid;gap:6px"><div class="row" style="justify-content:space-between"><b>'+LEVELS[k].name+' <span class="muted small">'+LEVELS[k].tag+'</span></b><span class="small muted">'+m+'/'+tot+' words · '+ps+'/30 lessons'+note+'</span></div><div class="meter" style="height:10px"><i style="width:'+(m/tot*100)+'%"></i></div></div>';}).join('');
  const bd=badges();
  return '<section class="grid" style="gap:18px"><h2 style="font-size:26px">My progress</h2>'+
    '<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:0"><div class="stat"><b>'+p.xp.toLocaleString()+'</b><span>total XP</span></div><div class="stat"><b>'+liveStreak(p)+'</b><span>day streak (best '+(p.best||0)+')</span></div><div class="stat"><b>'+masteredCount()+'</b><span>words mastered</span></div><div class="stat"><b>'+(p.games||0)+'</b><span>games played</span></div><div class="stat"><b>'+(p.hw||0)+'</b><span>homework handed in</span></div></div>'+
    '<div class="grid g2"><div class="panel"><div class="eyebrow">Last 14 days</div><h3 style="font-size:19px;margin:4px 0 10px">XP earned each day</h3>'+svg+'</div>'+
    '<div class="panel" style="display:grid;gap:14px;align-content:start"><div><div class="eyebrow">Levels</div><h3 style="font-size:19px;margin-top:4px">Words mastered</h3></div>'+lv+'<p class="small muted" style="margin:0">A word is mastered when you get it right 3 times in a row.</p></div></div>'+
    '<div class="panel"><div class="eyebrow">'+bd.filter(b=>b.on).length+' of '+bd.length+' earned</div><h3 style="font-size:19px;margin:4px 0 12px">Badges</h3><div class="badges">'+bd.map(b=>'<div class="badge'+(b.on?' on':'')+'">'+I.medal+'<b>'+b.t+'</b><span>'+b.d+'</span></div>').join('')+'</div></div>'+
    (S.db?'<div class="panel"><div class="eyebrow">Top 10 by total XP</div><h3 style="font-size:19px;margin:4px 0 12px">Class leaderboard</h3><div class="lb" id="lb">'+leaderboard()+'</div></div>':'')+
    '</section>';
}
function leaderboard(){
  const rows=S.classProg.slice().sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,10);
  if(!rows.length) return '<p class="muted" style="margin:0">Play a game to join the leaderboard.</p>';
  return rows.map((r,i)=>{const n=(S.profiles[r.id]&&S.profiles[r.id].name)||'Student';
    return '<div class="lb-row'+(r.id===S.uid?' me':'')+'"><b>'+(i+1)+'</b><span class="avatar" style="background:'+colorFor(r.id)+'">'+esc(initials(n))+'</span><span class="n">'+esc(n)+(r.id===S.uid?' (you)':'')+'</span><b>'+(r.xp||0).toLocaleString()+' XP</b></div>';}).join('');
}
