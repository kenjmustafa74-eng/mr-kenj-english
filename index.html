  const rows=students.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(r=>{const n=(S.profiles[r.id]&&S.profiles[r.id].name)||'Student';const subs=(S.subs[r.id]||[]);
    return '<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="avatar" style="background:'+colorFor(r.id)+'">'+esc(initials(n))+'</span>'+esc(n)+'</span></td><td>'+esc(r.level||'A')+'</td><td>'+(r.xp||0).toLocaleString()+'</td><td>'+liveStreak(r)+'</td><td>'+masteredCount(r)+'</td><td>'+lessonsPassed(r)+'</td><td>'+subs.length+(subs.filter(s=>!s.grade).length?' <span class="pill warn">'+subs.filter(s=>!s.grade).length+' new</span>':'')+'</td><td>'+(r.updatedAt?fmtDate(r.updatedAt):'—')+'</td></tr>';}).join('');
  const all=[];Object.entries(S.subs).forEach(([sid,list])=>list.forEach(s=>all.push(Object.assign({sid},s))));
  all.sort((a,b)=>(b.at||0)-(a.at||0));
  const shown=S.subFilter==='todo'?all.filter(s=>!s.grade):all;
  return '<section class="grid" style="gap:18px"><div><h2 style="font-size:26px">Teacher dashboard</h2><p class="muted" style="margin:4px 0 0">Share this app with your students as <b>Contributors</b> so they can save progress and upload homework.</p></div>'+viewLevelAccessPanel()+
  '<div class="panel"><div class="eyebrow">'+students.length+' learner'+(students.length===1?'':'s')+'</div><h3 style="font-size:20px;margin:4px 0 10px">Class progress</h3>'+
  (rows?'<div class="tbl"><table><thead><tr><th>Student</th><th>Level</th><th>XP</th><th>Streak</th><th>Words</th><th>Lessons passed</th><th>Homework</th><th>Last active</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="muted" style="margin:0">Students appear here after they open the app and play their first game.</p>')+'</div>'+
  '<div class="grid g2"><form class="panel grid" id="assign-form" style="gap:10px;align-content:start"><h3 style="font-size:20px">Set homework</h3>'+
  '<div class="field"><label for="as-title">Title</label><input type="text" id="as-title" required placeholder="Workbook page 12 + 5 sentences"></div>'+
  '<div class="field"><label for="as-lesson">Linked lesson (optional)</label><select id="as-lesson"><option value="">None</option>'+opts+'</select></div>'+
  '<div class="field"><label for="as-due">Due date</label><input type="date" id="as-due"></div>'+
  '<div class="field"><label for="as-details">Instructions</label><textarea id="as-details" placeholder="Write 5 sentences using this lesson\'s words. Upload a photo of your notebook."></textarea></div>'+
  '<div><button class="btn primary" type="submit">Post homework</button></div></form>'+
  '<div class="panel" style="display:grid;gap:10px;align-content:start"><h3 style="font-size:20px">Posted homework</h3>'+(S.assignments.length?S.assignments.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(a=>{const cnt=all.filter(s=>s.assignmentId===a.id).length;
    return '<div class="sub" style="gap:4px"><div class="row" style="justify-content:space-between"><b>'+esc(a.title)+'</b><button class="btn sm ghost" data-act="del-assign" data-id="'+a.id+'">'+(S.confirmDel===a.id?'Tap again to delete':'Delete')+'</button></div><span class="small muted">'+(a.due?'Due '+fmtDate(a.due)+' · ':'')+cnt+' handed in'+(a.lesson&&BYID[a.lesson]?' · '+LEVELS[a.lesson[0]].name+' L'+BYID[a.lesson].n:'')+'</span></div>';}).join(''):'<p class="muted" style="margin:0">Nothing posted yet.</p>')+'</div></div>'+
  '<div class="panel" style="display:grid;gap:12px"><div class="row" style="justify-content:space-between"><h3 style="font-size:20px">Submissions</h3><div class="row" style="gap:6px"><button class="btn sm'+(S.subFilter==='todo'?' primary':'')+'" data-act="subf" data-f="todo">Needs feedback ('+all.filter(s=>!s.grade).length+')</button><button class="btn sm'+(S.subFilter==='all'?' primary':'')+'" data-act="subf" data-f="all">All ('+all.length+')</button></div></div>'+
  (shown.length?'<div class="grid g2">'+shown.map(s=>{const n=(S.profiles[s.sid]&&S.profiles[s.sid].name)||'Student';const fid=s.sid+'__'+s.id;
    return '<div class="sub"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="row" style="gap:8px;flex-wrap:nowrap;min-width:0"><span class="avatar" style="background:'+colorFor(s.sid)+'">'+esc(initials(n))+'</span><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(n)+'</b></span><span class="small muted">'+fmtDate(s.at)+'</span></div>'+
    '<span class="eyebrow">'+esc(s.title||'Extra work')+'</span>'+(s.note?'<p style="margin:0;white-space:pre-wrap">'+esc(s.note)+'</p>':'')+filesHtml(s.files)+
    '<form class="grid fb-form" data-sid="'+esc(s.sid)+'" data-id="'+esc(s.id)+'" style="gap:8px"><div class="row" style="gap:8px"><label for="g-'+fid+'" class="small"><b>Grade</b></label><select id="g-'+fid+'" style="width:auto">'+['','Excellent','Very good','Good','Needs work','Redo please'].map(g=>'<option'+(s.grade===g?' selected':'')+'>'+g+'</option>').join('')+'</select></div>'+
    '<textarea id="t-'+fid+'" aria-label="Feedback" placeholder="Feedback for the student">'+esc(s.feedback||'')+'</textarea><div><button class="btn sm primary" type="submit">Save feedback</button></div></form></div>';}).join('')+'</div>':'<p class="muted" style="margin:0">'+(S.subFilter==='todo'?'All caught up.':'No submissions yet.')+'</p>')+'</div></section>';
}
const subListeners={};
function hydrateTeacher(){
  if(!S.db||!S.teacher) return;
  S.classProg.forEach(r=>{
    if(subListeners[r.id]) return;
    subListeners[r.id]=S.db.collection('submissions/'+r.id+'/items').onSnapshot(snap=>{
      S.subs[r.id]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==='teacher'&&!S.game&&!busyTyping())render();
    },()=>{});
  });
}
function busyTyping(){const a=document.activeElement;return a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)&&a.value;}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='say'){e.stopPropagation();speak(t.dataset.t,parseFloat(t.dataset.r)||0.95);return;}
  if(a==='level'){
    const l=t.dataset.l;
    if(KenjLevelAccess.LEVEL_IDS.indexOf(l)===-1) return;
    const hash=S.view==='practice'?'#practice/'+l:'#level/'+l;
    if(location.hash===hash){S.prog.level=l;if(S.view==='learn')S.lesson=null;save();const gate=accessFor(l);if(gate.reason==='locked')toast(LEVELS[l].name+' is locked for every student. Your progress is kept.');render();}
    else location.hash=hash;
    return;}
  if(a==='open-lesson'){
    const id=t.dataset.id;if(!BYID[id]) return;
    const hash='#learn/'+id;
    if(location.hash===hash){applyHash();render();}else location.hash=hash;
    window.scrollTo(0,0);return;}
  if(a==='close-lesson'){
    if((location.hash||'').indexOf('/')!==-1) location.hash='learn';
    else {S.lesson=null;render();}
    return;}
  if(a==='toggle-lock'){
    if(!S.levelTeacher){toast('Only a signed-in teacher can change level locks.');return;}
    const st=accessSnap();
    if(!st.canSave){toast('Wait until the class settings have loaded before saving.');return;}
    const base=st.locks||KenjLevelAccess.emptyLocks();
    saveLevelLocks(KenjLevelAccess.toggleLock(base,t.dataset.l,!base[t.dataset.l]));
    return;}
  if(a==='level-sign-out'){S.testGate=false;S.levelTeacher=false;S.teacherUnverified=false;S.teacherEmail='';S.gate='signed-out';stopAccessWatch();bindFirebaseProgress(null);if(S.fb)S.fb.signOut(S.fb.auth).catch(()=>{});render();return;}
  if(a==='forgot-password'){forgotPassword();return;}
  if(a==='approve-student'){setStudentGrant(t.dataset.uid,'approved');return;}
  if(a==='revoke-student'){setStudentGrant(t.dataset.uid,'revoked');return;}
  if(a==='send-verify'){
    const user=S.fb&&S.fb.auth&&S.fb.auth.currentUser;
    if(!user||!S.fb.sendVerification){toast('Sign in again before sending the confirmation email.');return;}
    try{await S.fb.sendVerification(user);toast('Confirmation email sent. Open it, then choose I have confirmed it.');}
    catch(e){toast(e&&e.code==='auth/too-many-requests'?'Wait a moment before sending another confirmation email.':'Could not send the confirmation email. Try again.');}
    return;}
  if(a==='recheck-verify'){
    const user=S.fb&&S.fb.auth&&S.fb.auth.currentUser;
    if(!user){toast('Sign in again, then confirm the address.');return;}
    try{
      await user.reload();
      applyTeacherUser(S.fb.auth.currentUser);
      toast(S.levelTeacher?'Address confirmed. You can change the level locks.':'This address is still not confirmed.');
      render();
    }catch(e){toast('Could not check the confirmation yet.');}
    return;}
  if(a==='review'){startGame('flash','review');return;}
  if(a==='play'){startGame(t.dataset.g,t.dataset.scope);return;}
  if(a==='exit'){S.game=null;clearInterval(matchTimer);render();return;}
  if(a==='lab'){const v=($('#lab-text')||{}).value;if(!v||!v.trim()){toast('Type a word or sentence first.');return;}speak(v,parseFloat(t.dataset.r));return;}
  if(a==='subf'){S.subFilter=t.dataset.f;render();return;}
  if(a==='del-assign'){
    if(S.confirmDel!==t.dataset.id){S.confirmDel=t.dataset.id;render();return;}
    S.confirmDel=null;try{await S.db.doc('assignments/'+t.dataset.id).delete();toast('Homework deleted');}catch(err){toast('Could not delete: '+(err.message||err.code));}return;}
  if(a==='kenj'){askKenj(t);return;}
  const g=S.game;if(!g)return;
  if(a==='flip'){g.flipped=!g.flipped;t.classList.toggle('flipped',g.flipped);if(g.flipped)speak(g.words[g.i].w);return;}
  if(a==='flash-ans'){const w=g.words[g.i];const ok=t.dataset.k==='1';grade(w,ok);if(!ok)g.xp+=2;next();return;}
  if(a==='say-ans'){const w=g.words[g.i];if(t.dataset.k==='1'){g.score++;g.xp+=5;}next();return;}
  if(a==='pick'){
    if(g.answered)return;g.answered=true;const w=g.words[g.i],o=g.opts[g.i][+t.dataset.j],ok=o.key===w.key;grade(w,ok);
    document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(g.opts[g.i][j].key===w.key)b.classList.add('right');});
    if(!ok)t.classList.add('wrong');
    const fb=$('#fb');fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Correct! +10':'The answer is: '+(g.type==='quiz'?w.m:w.w);
    speak(g.type==='gap'?w.e:w.w);setTimeout(next,ok?1100:2200);return;}
  if(a==='hint'){const w=g.words[g.i];$('#hint').textContent='Starts with “'+w.w.slice(0,2)+'…” · '+w.w.length+' letters';return;}
  if(a==='m-left'){g.sel=t.dataset.k;document.querySelectorAll('[data-act=m-left]').forEach(b=>b.classList.toggle('sel',b===t));speak(WORDBYKEY[t.dataset.k].w);return;}
  if(a==='m-right'){
    if(!g.sel){toast('Tap a word first.');return;}
    g.tries++;
    if(t.dataset.k===g.sel){g.matched.push(g.sel);setBox(g.sel,box(g.sel)+1);g.score++;g.xp+=5;g.sel=null;
      if(g.matched.length===g.words.length){g.secs=Math.round((Date.now()-g.start)/1000);g.score=Math.round(g.words.length*Math.min(1,g.words.length/g.tries));if(g.secs<30)g.xp+=15;g.i=g.words.length;finish();return;}
      render();
    }else{t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');}
    return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest&&e.target.closest('[data-act=flip]');if(t){e.preventDefault();t.click();}}});
document.addEventListener('change',e=>{if(e.target.id==='accent'){S.accent=e.target.value;lsSet('kenj-accent',S.accent);}});
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.id==='level-teacher-form'){e.preventDefault();const email=$('#teacher-email').value,password=$('#teacher-password').value;const pw=$('#teacher-password');if(pw)pw.value='';signInTeacher(email,password);return;}
  if(f.id==='spell-form'){e.preventDefault();const g=S.game;if(!g||g.answered)return;const w=g.words[g.i];const v=$('#spell-in').value;if(!v.trim())return;
    g.answered=true;const ok=norm(v)===norm(w.w);grade(w,ok);const fb=$('#fb');fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Correct! +10':'It is spelled: '+w.w;setTimeout(next,ok?1000:2200);return;}
  if(f.classList.contains('hw-form')){e.preventDefault();await handIn(f);return;}
  if(f.id==='assign-form'){e.preventDefault();const title=$('#as-title').value.trim();if(!title)return;
    try{await S.db.collection('assignments').add({title,lesson:$('#as-lesson').value,due:$('#as-due').value,details:$('#as-details').value.trim(),createdAt:Date.now()});toast('Homework posted');f.reset();}
    catch(err){toast('Could not post: '+(err.message||err.code));}return;}
  if(f.classList.contains('fb-form')){e.preventDefault();const fid=f.dataset.sid+'__'+f.dataset.id;
    try{await S.db.doc('submissions/'+f.dataset.sid+'/items/'+f.dataset.id).update({grade:document.getElementById('g-'+fid).value,feedback:document.getElementById('t-'+fid).value.trim(),gradedAt:Date.now()});document.activeElement&&document.activeElement.blur();toast('Feedback saved');}
    catch(err){toast('Could not save: '+(err.message||err.code));}return;}
});

/* ---------- Ask Mr. Kenj (sample) ---------- */
let kenjAbort=null;
async function askKenj(btn){
  const inp=$('#kenj-in'),out=$('#kenj-out');const text=inp.value.trim();if(!text){toast('Write a sentence first.');return;}
  const w=btn.dataset.key?WORDBYKEY[btn.dataset.key]:null;const lvl=w?w.lesson[0]:S.prog.level;
  const prompt='You are Mr. Kenj, a warm, encouraging English teacher. The student is at '+LEVELS[lvl].name+' ('+LEVELS[lvl].tag+').'+
    (w?' The target word is "'+w.w+'" meaning "'+w.m+'".':'')+
    '\nStudent sentence: """'+text.slice(0,600)+'"""\n'+
    'Reply in plain text, under 70 words, simple English for that level. 1) Say if it is correct'+(w?' and uses the target word well':'')+'. 2) If not, show the corrected sentence. 3) Give one short tip. No markdown.';
  out.hidden=false;out.textContent='Mr. Kenj is reading…';btn.disabled=true;
  if(kenjAbort)kenjAbort.abort();kenjAbort=new AbortController();
  try{const r=await S.sample(prompt,{modelTier:'quick',cache:false,signal:kenjAbort.signal,onText:u=>{out.textContent=u.text;}});out.textContent=r.text;addXP(5);}
  catch(e){out.textContent=e&&e.code==='rate_limited'?'Mr. Kenj needs a short break. Try again in a minute.':e&&e.code==='not_granted'?'Allow “Ask Claude” for this page to get sentence checks.':'Could not check right now. Please try again.';}
  finally{btn.disabled=false;}
}

/* ---------- boot ---------- */
function installTestHook(){
  const host=location.hostname;
  if(host!=='localhost'&&host!=='127.0.0.1') return;
  window.__KENJ_TEST__={
    applyRemote(data){const r=S.accessCtl.applySnapshot(data,Date.now());onAccessChanged();return r;},
    applyMissing(){const r=S.accessCtl.applyMissing(Date.now());onAccessChanged();return r;},
    applyError(err){S.accessCtl.applyError(err||{code:'test'},Date.now());onAccessChanged();},
    configure(){if(accessUnsub){accessUnsub();accessUnsub=null;}S.testGate=true;S.gate='approved';bindFirebaseProgress('test-student');S.accessCfg={configured:true,reason:'ready',teacherEmails:['teacher@example.com']};S.accessCtl.noteConfigured();S.testMemory=true;lsSet(KenjLevelAccess.FLAG_KEY,'1');listenTestChannel();render();},
    setAccess(kind,uid){
      S.testGate=true;S.gate=kind;S.game=null;
      if(kind==='signed-out'||kind==='checking'||kind==='blocked'){bindFirebaseProgress(null);S.levelTeacher=false;S.teacherUnverified=false;S.teacherEmail='';}
      else if(kind==='teacher'){bindFirebaseProgress(uid||'teacher-test');S.levelTeacher=true;S.teacherUnverified=false;S.teacherEmail='tchmk9@gmail.com';}
      else if(kind==='unverified'){bindFirebaseProgress(uid||'student-test');S.levelTeacher=false;S.teacherUnverified=true;S.teacherEmail='student@school.test';}
      else{bindFirebaseProgress(uid||'student-test');S.levelTeacher=false;S.teacherUnverified=false;S.teacherEmail='student@school.test';}
      if(kind==='revoked') rememberAccess(S.fbUid,'revoked');
      render();
    },
    signIn(){if(!S.testMemory)return;S.levelTeacher=true;S.teacherEmail='teacher@example.com';render();},
    seedProgress(partial){partial=partial||{};if(partial.scores)Object.assign(S.prog.scores,partial.scores);if(partial.cards)Object.assign(S.prog.cards,partial.cards);if(partial.xp!=null)S.prog.xp=partial.xp;save();render();},
    showHomework(lessonId){S.assignments=[{id:'hw1',title:'Workbook page',lesson:lessonId,due:'',details:''}];S.db=S.db||{collection:function(){return {onSnapshot:function(){return function(){};}};},doc:function(){return {};}};location.hash='homework';},
    mockPasswordReset(mode){S.resetPasswordMock=async email=>{S.resetCalls=(S.resetCalls||0)+1;S.lastResetEmail=email;if(mode==='slow'){await new Promise(r=>setTimeout(r,400));return;}if(mode==='invalid'){const e=new Error('invalid');e.code='auth/invalid-email';throw e;}if(mode==='rate'){const e=new Error('rate');e.code='auth/too-many-requests';throw e;}if(mode==='offline'){const e=new Error('offline');e.code='auth/network-request-failed';throw e;}if(mode==='missing'){const e=new Error('missing');e.code='auth/user-not-found';throw e;};};S.resetCalls=0;},
    resetCalls(){return S.resetCalls||0;},
    clearResetNotice(){S.resetNotice=null;},
    gate(){return S.gate;},
    state(){return accessSnap();},
    progress(){return JSON.parse(JSON.stringify(S.prog));}
  };
}
function boot(){
  installTestHook();
  applyHash();
  render();
  startLevelAccess();
  if(!window.claude||!window.claude.use){S.ready=true;render();return;}
  (async()=>{
    const [db,user,assets,sample]=await Promise.all(['db','user','assets','sample'].map(n=>window.claude.use(n).catch(()=>null)));
    S.db=db;S.user=user;S.assets=assets;S.sample=sample;
    if(user){
      try{S.uid=await user.id();}catch(e){}
      try{const me=await user.me();S.name=me&&me.name||'';}catch(e){}
      try{S.teacher=!!(await user.canEdit());}catch(e){}
    }
    if(db&&S.uid){
      const timer=setTimeout(()=>{if(!S.ready){S.ready=true;render();}},10000);
      LSKEY='kenj-prog:'+S.uid;const local=readLocal(LSKEY);S.prog=local;
      try{
        const snap=await db.doc('progress/'+S.uid).get();
        const remote=snap.exists?Object.assign(defaultProg(),snap.data()||{}):null;
        if(remote&&remote.xp>=local.xp) S.prog=remote; else if(local.xp>0) save();
      }catch(e){}
      clearTimeout(timer);
      db.collection('assignments').onSnapshot(s=>{S.assignments=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(!S.game&&!busyTyping())render();},()=>{});
      db.collection('submissions/'+S.uid+'/items').onSnapshot(s=>{S.mySubs=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.at||0)-(a.at||0));if(S.view==='homework'&&!S.game&&!busyTyping())render();},()=>{});
      db.collection('progress').onSnapshot(async s=>{
        S.classProg=s.docs.map(d=>Object.assign({id:d.id},d.data()));
        try{const ids=S.classProg.map(r=>r.id);if(ids.length&&user)S.profiles=await user.profiles(ids);}catch(e){}
        if(!S.game&&(S.view==='progress'||S.view==='teacher')&&!busyTyping())render();
      },()=>{});
    }
    S.ready=true;route();
  })();
}
window.addEventListener('pagehide',()=>{lsSet(LSKEY,JSON.stringify(S.prog));});
boot();
})();
